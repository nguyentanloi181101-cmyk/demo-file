<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lắp khung xương tướng</title>
<style>
:root{--bg:#14161c;--panel:#1d2028;--line:#2c313d;--txt:#e6e8ee;--mut:#8b93a5;--acc:#4cc9f0;--acc2:#f72585}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0 8px 0 0}
button,.btn{background:#2a2f3b;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit}
button:hover,.btn:hover{border-color:var(--acc)}
button.primary{background:var(--acc);color:#05202a;border-color:var(--acc);font-weight:600}
input[type=text]{background:#10121a;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:140px;font:inherit}
input[type=number]{background:#10121a;color:var(--txt);border:1px solid var(--line);border-radius:4px;padding:3px 4px;width:64px;font:inherit}
label.chk{display:flex;gap:4px;align-items:center;color:var(--mut);cursor:pointer}
main{flex:1;display:grid;grid-template-columns:1fr 340px;grid-template-rows:minmax(0,1fr);min-height:0}
main[data-tab=add]{grid-template-columns:1fr}
main[data-tab=add] #stage,main[data-tab=add] #right{display:none}
main[data-tab=view] #addTab{display:none}
#tabs{display:flex;gap:6px;padding:6px 12px 0;background:var(--panel);border-bottom:1px solid var(--line)}
#tabs button{border-radius:8px 8px 0 0;border-bottom:none;padding:8px 18px;font-weight:600;color:var(--mut)}
#tabs button.on{background:var(--bg);color:var(--acc);border-color:var(--acc)}
#addTab{overflow:auto;padding:12px;min-width:0}
.addbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.addbar h3{margin:0 8px 0 0}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
#list .thumb{width:60px;height:60px}
#list .item{background:var(--panel);border-color:var(--line)}
#list .tip{grid-column:1/-1}
#right{display:flex;flex-direction:column;overflow:auto;background:var(--panel);border-left:1px solid var(--line);min-width:0}
aside{padding:8px}
.item{display:flex;gap:8px;align-items:center;padding:6px;border:1px solid transparent;border-radius:8px;cursor:pointer}
.item:hover{background:#252a35}
.item.sel{border-color:var(--acc);background:#202b36}
.item.drop{border-color:var(--acc2)}
.thumb{width:38px;height:38px;border-radius:6px;background:repeating-conic-gradient(#2a2f3b 0 25%,#232733 0 50%) 0 0/10px 10px;display:flex;align-items:center;justify-content:center;flex:none;overflow:hidden}
.thumb img{max-width:100%;max-height:100%}
.item .nm{flex:1;min-width:0}
.item .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .nm small{color:var(--mut)}
.item .ok{color:#6ee7a0}
#stage{display:flex;flex-direction:column;gap:8px;padding:10px;min-width:0;min-height:0}
#cvwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;container-type:size}
#anbar{border-bottom:1px solid var(--line);padding:10px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.anrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.anrow select{width:auto;max-width:190px}
header select{width:auto}
.anrow input[type=range]{flex:1;min-width:90px}
.kc{padding:2px 7px;font-size:12px}
canvas{width:min(100cqw,75cqh);height:auto;max-width:100%;aspect-ratio:3/4;border:1px solid var(--line);border-radius:8px;touch-action:none;background:repeating-conic-gradient(#222633 0 25%,#1b1e28 0 50%) 0 0/20px 20px}
.row{display:grid;grid-template-columns:96px 1fr 64px;gap:6px;align-items:center;margin:5px 0}
.row span{color:var(--mut);font-size:12px}
.row input[type=range]{width:100%}
h3{margin:4px 0 8px;font-size:14px}
.tip{color:var(--mut);font-size:12px;margin-top:10px}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
select{background:#10121a;color:var(--txt);border:1px solid var(--line);border-radius:4px;padding:3px;font:inherit;min-width:0;width:100%}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:10}
#modal[hidden]{display:none}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(680px,94vw);max-height:90vh;display:flex;flex-direction:column;padding:14px}
#mList{overflow:auto;flex:1;margin:8px 0}
.mrow{display:grid;grid-template-columns:20px 44px 1fr 190px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.mrow small{color:var(--mut)}
.mrow .thumb canvas{max-width:100%;max-height:100%}
.mfoot{display:flex;gap:8px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
@media(max-width:860px){body{height:auto}main{display:block}#stage{height:80vh}#right{border-left:0}#addTab{overflow:visible}}
</style>
</head>
<body>
<header>
  <h1>🦴 Lắp khung xương tướng</h1>
  <input type="text" id="cname" value="tuong_01" title="Tên tướng">
  <label class="chk">Góc nhìn <select id="viewSel"><option value="front">Chính diện</option><option value="left">Nghiêng trái 90°</option><option value="right">Nghiêng phải 90°</option></select></label>
  <button id="bSave">Lưu dự án</button>
  <label class="btn">Mở dự án<input type="file" id="bLoad" accept=".json" hidden></label>
  <button id="bPng">Xuất PNG</button>
  <button id="bZip" class="primary">Xuất tướng (.zip)</button>
  <label class="chk"><input type="checkbox" id="cBones" checked>Xương</label>
  <label class="chk"><input type="checkbox" id="cGrid" checked>Lưới</label>
  </header>
<nav id="tabs"><button data-tab="add">① Thêm ảnh</button><button data-tab="view" class="on">② Xem &amp; chỉnh</button></nav>
<main data-tab="view">
  <section id="addTab">
    <div class="addbar"><h3>Thêm ảnh bộ phận</h3>
      <label class="btn primary">Mở PSD (tự tách + gắn)<input type="file" id="psdIn" accept=".psd,.psb" hidden></label>
      <label class="btn">Chọn nhiều ảnh<input type="file" id="multi" accept="image/*" multiple hidden></label>
      <button id="toView">Xem &amp; chỉnh →</button></div>
    <div id="list"></div>
  </section>
  <section id="stage">
    <div id="cvwrap"><canvas id="cv"></canvas></div>
  </section>
  <div id="right">
    <div id="anbar">
      <div class="anrow"><b>Chuyển động</b><select id="anSel"></select><button id="anPlay">▶</button><button id="anNew">Mới</button><button id="anDup">Nhân bản</button><button id="anDel">Xóa</button><button id="anRst">Khôi phục mẫu</button></div>
      <div class="anrow"><label class="chk"><input type="checkbox" id="anLoop">Lặp</label><label class="chk" title="Chuyển đều giữa các keyframe, không giảm tốc ở mỗi mốc"><input type="checkbox" id="anLin">Chuyển đều</label><label class="chk">Thời lượng (s) <input type="number" id="anDur" step="0.1" min="0.1" value="1" style="width:64px"></label><label class="chk">Tốc độ <input type="range" id="anSpd" min="0.25" max="2" step="0.05" value="1"><span id="anSpdV">1x</span></label></div>
      <div class="anrow"><input type="range" id="anT" min="0" max="1" step="0.01" value="0"><span id="anTv" style="min-width:90px;color:var(--mut)"></span><button id="anKey">＋ Ghi keyframe</button><button id="anKdel">Xóa key</button><button id="anZero">Về tư thế gốc</button></div>
      <div class="anrow" id="anKeys"></div>
      <div class="anrow"><span style="color:var(--mut)">Cả người:</span> X <input type="range" id="rX" min="-300" max="300" step="1" value="0"> Y <input type="range" id="rY" min="-300" max="300" step="1" value="0"> Xoay <input type="range" id="rR" min="-360" max="360" step="1" value="0"> Lật ngang <input type="range" id="rS" min="-2" max="0" step="0.01" value="0"></div>
      <div class="tip" style="margin:0">Tự tạo động tác: kéo thanh thời gian tới mốc cần → chọn bộ phận, chỉnh “Xoay động tác” ở bảng bên phải → bấm “Ghi keyframe”. Lặp lại ở các mốc khác rồi bấm ▶.</div>
    </div>
    <aside id="props"></aside>
  </div>
</main>
<div id="modal" hidden><div class="mbox">
  <h3 id="mTitle" style="margin:0">PSD</h3>
  <div id="mList"></div>
  <div class="mfoot">
    <label class="chk"><input type="checkbox" id="mPos" checked>Xếp theo vị trí trong PSD</label>
    <button id="mCancel">Hủy</button>
    <button id="mOk" class="primary">Gắn vào khung xương</button>
  </div>
</div></div>

<script>
const W=600,H=800,ROOT={x:300,y:470};
// id, tên, cha, x, y, pivotX, pivotY, chiều cao, z
const DEFS=[
['cape','Áo choàng / tóc sau','torso',0,-150,.5,.05,300,1],
['thighL','Đùi trái','root',-30,20,.5,.08,140,2],
['shinL','Cẳng chân trái','thighL',0,130,.5,.08,140,2],
['thighR','Đùi phải','root',30,20,.5,.08,140,2],
['shinR','Cẳng chân phải','thighR',0,130,.5,.08,140,2],
['pelvis','Hông','root',0,0,.5,.5,80,3],
['torso','Thân','root',0,-20,.5,1,180,4],
['armL','Cánh tay trái','torso',-60,-150,.5,.08,110,5],
['forearmL','Cẳng tay trái','armL',0,100,.5,.08,110,5],
['armR','Cánh tay phải','torso',60,-150,.5,.08,110,5],
['forearmR','Cẳng tay phải','armR',0,100,.5,.08,110,5],
['head','Đầu','torso',0,-170,.5,.9,130,6],
['weapon','Vũ khí','forearmR',0,100,.5,.75,250,7]
];
const parts=DEFS.map(d=>({id:d[0],name:d[1],parent:d[2],x:d[3],y:d[4],px:d[5],py:d[6],h:d[7],z:d[8],rot:0,sc:1,flip:false,vis:true,img:null,src:null,def:d}));
const byId={};parts.forEach(p=>byId[p.id]=p);
let sel='torso',lastB={},drag=null;
const $=s=>document.querySelector(s);
const cv=$('#cv'),ctx=cv.getContext('2d');
const DPR=Math.min(2,window.devicePixelRatio||1);
cv.width=W*DPR;cv.height=H*DPR;

function setSrc(p,src){return new Promise(res=>{
  if(!src){p.img=null;p.src=null;return res();}
  const im=new Image();im.onload=()=>{p.img=im;p.src=src;res();};im.onerror=()=>res();im.src=src;});}
function loadFile(p,file){return new Promise(res=>{const fr=new FileReader();fr.onload=()=>setSrc(p,fr.result).then(res);fr.readAsDataURL(file);});}
const norm=s=>s.toLowerCase().replace(/\.[^.]+$/,'').replace(/[^a-z0-9]/g,'');

function dims(p){
  if(p.img){const s=p.h/p.img.height*p.sc;return[p.img.width*s,p.img.height*s];}
  return[p.h*.4*p.sc,p.h*p.sc];
}
function animOffsets(t){
  return{torso:Math.sin(t*2)*1.2,head:Math.sin(t*2+1)*2,armL:Math.sin(t*2)*5,armR:-Math.sin(t*2)*5,
    forearmL:Math.sin(t*2+.6)*4,forearmR:-Math.sin(t*2+.6)*4,cape:Math.sin(t*2+2)*3,thighL:Math.sin(t*2)*2,thighR:-Math.sin(t*2)*2};
}
function matrices(anim){
  const c={};
  const sg=view==='right'?-1:1;
  c.__root=new DOMMatrix().translate(ROOT.x+sg*(anim.rootX||0),ROOT.y+(anim.rootY||0)).rotate(sg*(anim.rootR||0)).scale(sg*(1+(anim.rootSX||0)),1);
  function B(p){
    if(c[p.id])return c[p.id];
    const pm=p.parent==='root'?c.__root:B(byId[p.parent]);
    return c[p.id]=pm.translate(p.x,p.y).rotate((p.rot||0)+(anim[p.id]||0));
  }
  parts.forEach(B);return c;
}
function draw(g,o){
  const dpr=o.dpr,B=matrices(o.anim||{});
  g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,W*dpr,H*dpr);
  const base=new DOMMatrix().scale(dpr);
  if(o.guides&&o.grid){
    g.setTransform(base);g.strokeStyle='rgba(255,255,255,.06)';g.lineWidth=1;g.beginPath();
    for(let x=0;x<=W;x+=50){g.moveTo(x,0);g.lineTo(x,H);}
    for(let y=0;y<=H;y+=50){g.moveTo(0,y);g.lineTo(W,y);}
    g.stroke();
    g.strokeStyle='rgba(247,37,133,.5)';g.beginPath();g.moveTo(0,ROOT.y+160+140-30);g.lineTo(W,ROOT.y+160+140-30);g.stroke();
  }
  const order=parts.map((p,i)=>[p,i]).sort((a,b)=>a[0].z-b[0].z||a[1]-b[1]);
  for(const[p]of order){
    if(!p.vis)continue;
    const[w,h]=dims(p);
    g.setTransform(base.multiply(B[p.id]));
    g.scale(p.flip?-1:1,1);
    if(p.img){g.drawImage(p.img,-p.px*w,-p.py*h,w,h);}
    else if(o.guides){
      g.fillStyle=p.id===sel?'rgba(76,201,240,.18)':'rgba(255,255,255,.06)';
      g.strokeStyle='rgba(255,255,255,.25)';g.setLineDash([5,4]);
      g.fillRect(-p.px*w,-p.py*h,w,h);g.strokeRect(-p.px*w,-p.py*h,w,h);g.setLineDash([]);
      g.fillStyle='rgba(255,255,255,.45)';g.font='11px system-ui';g.textAlign='center';
      const rm=B.__root,neg=((rm.a*rm.d-rm.b*rm.c)<0)!==!!p.flip;
      if(neg){g.save();g.scale(-1,1);g.fillText(p.name,-(.5-p.px)*w,(.5-p.py)*h);g.restore();}
      else g.fillText(p.name,(.5-p.px)*w,(.5-p.py)*h);
    }
  }
  if(o.guides){
    g.setTransform(base);
    if(o.bones){
      g.strokeStyle='rgba(76,201,240,.7)';g.fillStyle='#4cc9f0';g.lineWidth=2;
      for(const p of parts){
        const m=B[p.id];const pm=p.parent==='root'?B.__root:B[p.parent];
        g.beginPath();g.moveTo(pm.e,pm.f);g.lineTo(m.e,m.f);g.stroke();
        g.beginPath();g.arc(m.e,m.f,3,0,7);g.fill();
      }
    }
    const p=byId[sel];
    if(p){
      const[w,h]=dims(p);
      g.setTransform(base.multiply(B[p.id]));g.scale(p.flip?-1:1,1);
      g.strokeStyle='#f72585';g.lineWidth=1.5;g.strokeRect(-p.px*w,-p.py*h,w,h);
      g.setTransform(base);const m=B[p.id];
      g.fillStyle='#f72585';g.beginPath();g.arc(m.e,m.f,6,0,7);g.fill();
      g.strokeStyle='#fff';g.lineWidth=1.5;g.stroke();
    }
  }
  return B;
}
function frame(now){
  const dt=Math.min(.1,((now||lastT)-lastT)/1000);lastT=now||lastT;
  if(playing){
    const a=anims[curAnim];ptime+=dt*speed;
    if(a.loop)ptime%=a.dur;
    else if(ptime>=a.dur){ptime=a.dur;playing=false;$('#anPlay').textContent='▶';}
    curPose=sample(a,ptime);syncAn();
  }
  lastB=draw(ctx,{guides:true,dpr:DPR,grid:$('#cGrid').checked,bones:$('#cBones').checked,anim:curPose});
  requestAnimationFrame(frame);
}

// ---------- chọn / kéo ----------
function pt(e){const r=cv.getBoundingClientRect();return new DOMPoint((e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height);}
function parentM(p){return p.parent==='root'?lastB.__root:lastB[p.parent];}
function hit(q){
  const order=parts.map((p,i)=>[p,i]).sort((a,b)=>b[0].z-a[0].z||b[1]-a[1]);
  for(const[p]of order){
    if(!p.vis)continue;
    const l=lastB[p.id].inverse().transformPoint(q);
    const[w,h]=dims(p);const x=p.flip?-l.x:l.x;
    if(x>=-p.px*w&&x<=(1-p.px)*w&&l.y>=-p.py*h&&l.y<=(1-p.py)*h)return p;
  }
  return null;
}
cv.addEventListener('pointerdown',e=>{
  const q=pt(e);
  let p=hit(q);
  if(!p)return;
  select(p.id);
  const l=parentM(p).inverse().transformPoint(q);
  drag={id:p.id,sx:p.x,sy:p.y,l0:l,PM:parentM(p)};
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{
  if(!drag)return;
  const p=byId[drag.id];const l=drag.PM.inverse().transformPoint(pt(e));
  p.x=Math.round(drag.sx+l.x-drag.l0.x);p.y=Math.round(drag.sy+l.y-drag.l0.y);
  syncProps();
});
cv.addEventListener('pointerup',()=>drag=null);
window.addEventListener('keydown',e=>{
  if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;
  const p=byId[sel],s=e.shiftKey?10:1;
  const k={ArrowLeft:[-s,0],ArrowRight:[s,0],ArrowUp:[0,-s],ArrowDown:[0,s]}[e.key];
  if(k){p.x+=k[0];p.y+=k[1];syncProps();e.preventDefault();}
});

// ---------- danh sách bộ phận ----------
function buildList(){
  const L=$('#list');L.innerHTML='';
  parts.forEach(p=>{
    const d=document.createElement('div');d.className='item'+(p.id===sel?' sel':'');d.dataset.id=p.id;
    d.innerHTML='<div class="thumb">'+(p.src?'<img src="'+p.src+'">':'')+'</div><div class="nm"><b>'+p.name+'</b><small class="'+(p.src?'ok':'')+'">'+(p.src?'✓ đã có ảnh':'kéo thả ảnh vào đây')+'</small></div>';
    const f=document.createElement('input');f.type='file';f.accept='image/*';f.hidden=true;d.appendChild(f);
    const b=document.createElement('button');b.textContent='Ảnh';b.onclick=ev=>{ev.stopPropagation();f.click();};d.appendChild(b);
    f.onchange=async()=>{if(f.files[0]){await loadFile(p,f.files[0]);select(p.id);}};
    d.onclick=()=>select(p.id);
    d.ondragover=ev=>{ev.preventDefault();d.classList.add('drop');};
    d.ondragleave=()=>d.classList.remove('drop');
    d.ondrop=async ev=>{ev.preventDefault();d.classList.remove('drop');const fl=ev.dataTransfer.files[0];if(fl){await loadFile(p,fl);select(p.id);}};
    L.appendChild(d);
  });
  const t=document.createElement('div');t.className='tip';
  t.innerHTML='Mẹo: đặt tên file trùng mã bộ phận (head, torso, armL, forearmL, armR, forearmR, thighL, shinL, thighR, shinR, pelvis, cape, weapon) rồi bấm <b>Chọn nhiều ảnh</b> để tự gắn.';
  L.appendChild(t);
}
function select(id){sel=id;buildList();buildProps();}

// ---------- bảng thuộc tính ----------
const FIELDS=[['x','X',-600,600,1],['y','Y',-600,600,1],['rot','Xoay (độ)',-180,180,1],['sc','Tỉ lệ',.1,3,.01],['h','Cao gốc (px)',10,800,1],['px','Tâm xoay X',0,1,.01],['py','Tâm xoay Y',0,1,.01],['z','Lớp (z)',-5,20,1]];
function buildProps(){
  const P=$('#props'),p=byId[sel];P.innerHTML='<h3>'+p.name+' <small style="color:var(--mut)">('+p.id+')</small></h3>';
  FIELDS.forEach(([k,lab,mn,mx,st])=>{
    const r=document.createElement('div');r.className='row';
    r.innerHTML='<span>'+lab+'</span><input type="range" min="'+mn+'" max="'+mx+'" step="'+st+'" data-k="'+k+'"><input type="number" step="'+st+'" data-k="'+k+'">';
    r.querySelectorAll('input').forEach(i=>i.oninput=()=>{p[k]=parseFloat(i.value)||0;if(k==='z'||true)syncProps(i);});
    P.appendChild(r);
  });
  const pr=document.createElement('div');pr.className='row';
  pr.innerHTML='<span>Xoay động tác</span><input type="range" min="-180" max="180" step="1" data-pk="1"><input type="number" step="1" data-pk="1">';
  pr.querySelectorAll('input').forEach(i=>i.oninput=()=>{curPose[p.id]=parseFloat(i.value)||0;syncProps(i);});
  P.appendChild(pr);
  const c=document.createElement('div');c.style.cssText='display:flex;gap:14px;margin:8px 0';
  c.innerHTML='<label class="chk"><input type="checkbox" id="pFlip">Lật ngang</label><label class="chk"><input type="checkbox" id="pVis">Hiện</label>';
  P.appendChild(c);
  $('#pFlip').onchange=e=>p.flip=e.target.checked;
  $('#pVis').onchange=e=>p.vis=e.target.checked;
  const b=document.createElement('div');b.className='btns';
  b.innerHTML='<button id="pRm">Xóa ảnh</button><button id="pRs">Đặt lại vị trí</button>';

function makeZip(files){
  const enc=new TextEncoder(),chunks=[],cen=[];let off=0;

    v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,0x0800,true);v.setUint16(12,0x21,true);
    v.setUint32(14,crc,true);v.setUint32(18,n,true);v.setUint32(22,n,true);v.setUint16(26,nb.length,true);l.set(nb,30);

let anims=builtinAnims(),curAnim='Đứng yên (idle)',curPose={},playing=false,ptime=0,speed=1,lastT=performance.now();
function sample(a,t){
  const ks=a.keys;if(!ks.length)return{};
  if(a.loop)t=((t%a.dur)+a.dur)%a.dur;else t=Math.max(0,Math.min(a.dur,t));

  let A,B,ta,tb;
  if(i0<0){A=ks[ks.length-1];B=ks[0];if(!a.loop)return Object.assign({},B.pose);ta=A.t-a.dur;tb=B.t;}
  else if(i0===ks.length-1){A=ks[i0];if(!a.loop)return Object.assign({},A.pose);B=ks[0];ta=A.t;tb=B.t+a.dur;}

}
function splitPose(p){

let view='front';
const SIDE={cape:{x:10,z:1},thighL:{x:-4,z:5},shinL:{z:5},thighR:{x:4,z:2},shinR:{z:2},pelvis:{z:3},torso:{z:4},
  armL:{x:-2,z:6},forearmL:{z:6},armR:{x:2,z:2.5},forearmR:{z:2.5},head:{z:7},weapon:{parent:'forearmL',z:6.5}};
function applyLayout(side){
  parts.forEach(p=>{
    const d=p.def;p.parent=d[2];p.x=d[3];p.y=d[4];p.z=d[8];
    if(side&&SIDE[p.id])Object.assign(p,SIDE[p.id]);

}
$('#viewSel').onchange=e=>{

  select(sel);
};

// ---------- đọc PSD ----------
const BIGKEYS=new Set(['LMsk','Lr16','Lr32','Layr','Mt16','Mt32','Mtrn','Alph','FMsk','lnk2','FEid','FXid','PxSD']);
class PR{
  constructor(buf){this.b=new Uint8Array(buf);this.v=new DataView(buf);this.p=0;}
  u8(){return this.v.getUint8(this.p++);}
  u16(){const x=this.v.getUint16(this.p);this.p+=2;return x;}
  i16(){const x=this.v.getInt16(this.p);this.p+=2;return x;}
  u32(){const x=this.v.getUint32(this.p);this.p+=4;return x;}
  i32(){const x=this.v.getInt32(this.p);this.p+=4;return x;}
  u64(){const hi=this.v.getUint32(this.p),lo=this.v.getUint32(this.p+4);this.p+=8;return hi*4294967296+lo;}
  str(n){let s='';for(let i=0;i<n;i++)s+=String.fromCharCode(this.b[this.p+i]);this.p+=n;return s;}
  skip32(){const n=this.u32();this.p+=n;}
}
async function inflate(u8){
  const st=new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate'));
  return new Uint8Array(await new Response(st).arrayBuffer());
}
function unpack(b,s,e,out,o){
  let i=s;
  while(i<e){
    let n=b[i++];if(n>127)n-=256;
    if(n>=0){for(let k=0;k<=n;k++)out[o++]=b[i++];}
    else if(n!==-128){const v=b[i++];for(let k=0;k<1-n;k++)out[o++]=v;}
  }
}
async function decodeChannel(r,w,h,len,depth,big){
  const start=r.p,comp=r.u16(),bps=depth/8,rowB=w*bps;
  const out=new Uint8Array(rowB*h),ds=r.p,dlen=len-2;
  if(rowB*h>0){
    if(comp===0){out.set(r.b.subarray(ds,ds+rowB*h));}
    else if(comp===1){
      let q=ds;const counts=[];
      for(let y=0;y<h;y++){counts.push(big?r.v.getUint32(q):r.v.getUint16(q));q+=big?4:2;}
      for(let y=0;y<h;y++){unpack(r.b,q,q+counts[y],out,y*rowB);q+=counts[y];}
    }else if(comp===2||comp===3){
      const raw=await inflate(r.b.subarray(ds,ds+dlen));
      if(comp===3){
        if(bps===1){for(let y=0;y<h;y++)for(let x=1;x<w;x++)raw[y*w+x]+=raw[y*w+x-1];}
        else{const dv=new DataView(raw.buffer,raw.byteOffset,raw.byteLength);
          for(let y=0;y<h;y++)for(let x=1;x<w;x++)dv.setUint16((y*w+x)*2,(dv.getUint16((y*w+x)*2)+dv.getUint16((y*w+x-1)*2))&0xFFFF);}
      }
      out.set(raw.subarray(0,rowB*h));
    }else throw new Error('Kiểu nén kênh màu không hỗ trợ ('+comp+')');
  }
  r.p=start+len;
  if(bps===2){const o8=new Uint8Array(w*h);for(let i=0;i<w*h;i++)o8[i]=out[i*2];return o8;}
  return out;
}
async function parsePSD(buf,progress){
  const r=new PR(buf);
  if(r.str(4)!=='8BPS')throw new Error('Đây không phải file PSD/PSB.');
  const ver=r.u16();if(ver!==1&&ver!==2)throw new Error('Phiên bản file không hỗ trợ.');
  const big=ver===2;const L=()=>big?r.u64():r.u32();
  r.p+=6;r.u16();const PH_=r.u32(),PW_=r.u32(),depth=r.u16(),mode=r.u16();
  if(mode!==3&&mode!==1)throw new Error('Chỉ hỗ trợ chế độ màu RGB hoặc Grayscale. Trong Photoshop vào Image > Mode > RGB Color rồi lưu lại.');
  if(depth!==8&&depth!==16)throw new Error('Chỉ hỗ trợ 8-bit hoặc 16-bit mỗi kênh. Đổi sang Image > Mode > 8 Bits/Channel rồi lưu lại.');
  r.skip32();r.skip32();
  const miscLen=L();if(miscLen===0)throw new Error('File này không có lớp nào (chỉ có 1 ảnh phẳng).');
  const liLen=L();if(liLen===0)throw new Error('File này không có lớp nào (chỉ có 1 ảnh phẳng).');
  const cnt=Math.abs(r.i16()),recs=[];
  for(let i=0;i<cnt;i++){
    const top=r.i32(),left=r.i32(),bottom=r.i32(),right=r.i32(),nc=r.u16(),chans=[];
    for(let j=0;j<nc;j++){const id=r.i16();chans.push({id,len:L()});}
    r.str(4);r.str(4);const opacity=r.u8();r.u8();const flags=r.u8();r.p++;
    const exLen=r.u32(),exEnd=r.p+exLen;
    r.skip32();r.skip32();
    const nl=r.u8();let name=r.str(nl);r.p+=(4-((1+nl)%4))%4;
    let uname=null,sect=0;
    while(r.p+12<=exEnd){
      r.str(4);const k=r.str(4);const len=(big&&BIGKEYS.has(k))?r.u64():r.u32();const st=r.p;
      if(k==='luni'){const n=r.u32();let s='';for(let q=0;q<n;q++)s+=String.fromCharCode(r.u16());uname=s.replace(/\0+$/,'');}
      else if(k==='lsct'){sect=r.u32();}
      r.p=st+len;
    }
    r.p=exEnd;
    recs.push({top,left,bottom,right,chans,opacity,visible:!(flags&2),name:uname||name,sect});
  }
  const out=[];
  for(let i=0;i<recs.length;i++){
    const rc=recs[i],w=rc.right-rc.left,h=rc.bottom-rc.top,data={};
    progress('Đang đọc lớp '+(i+1)+'/'+recs.length+' …');
    for(const ch of rc.chans){
      if(w>0&&h>0&&ch.id>=-1)data[ch.id]=await decodeChannel(r,w,h,ch.len,depth,big);
      else r.p+=ch.len;
    }
    if(rc.sect>=1&&rc.sect<=3)continue;
    if(w<=0||h<=0)continue;
    const c=document.createElement('canvas');c.width=w;c.height=h;
    const g=c.getContext('2d'),im=g.createImageData(w,h),d=im.data;
    const A=data[-1],n=w*h;
    if(mode===3){const Rr=data[0],Gg=data[1],Bb=data[2];
      for(let k=0;k<n;k++){d[k*4]=Rr?Rr[k]:0;d[k*4+1]=Gg?Gg[k]:0;d[k*4+2]=Bb?Bb[k]:0;d[k*4+3]=A?A[k]:255;}}
    else{const Y=data[0];for(let k=0;k<n;k++){const v=Y?Y[k]:0;d[k*4]=d[k*4+1]=d[k*4+2]=v;d[k*4+3]=A?A[k]:255;}}
    g.putImageData(im,0,0);
    out.push({name:rc.name,x:rc.left,y:rc.top,w,h,visible:rc.visible,on:false,canvas:c,part:''});
  }
  return{W:PW_,H:PH_,layers:out};
}

// ---------- hộp thoại gắn lớp PSD vào xương ----------
let psdPending=null;
const normName=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/[^a-z0-9]/g,'');
const ALIAS={head:['dau'],torso:['than','body'],pelvis:['hong','hip'],cape:['aochoang','cloak'],weapon:['vukhi','sword']};
function autoMatchPsd(){
  const ids=parts.map(p=>p.id).sort((a,b)=>b.length-a.length);
  psdPending.layers.forEach(l=>{
    const n=normName(l.name);
    let m=ids.find(i=>normName(i)===n);
    if(!m)for(const[k,al]of Object.entries(ALIAS))if(al.includes(n))m=k;
    if(!m)m=ids.find(i=>n.includes(normName(i)));
    l.part=m||'';l.on=!!m&&l.visible;
  });
}
function thumbOf(c){
  const t=document.createElement('canvas'),s=Math.min(44/c.width,44/c.height,1);
  t.width=Math.max(1,Math.round(c.width*s));t.height=Math.max(1,Math.round(c.height*s));
  t.getContext('2d').drawImage(c,0,0,t.width,t.height);return t;
}
function buildModal(){
  const res=psdPending,M=$('#mList');M.innerHTML='';
  $('#mTitle').textContent='PSD: '+res.layers.length+' lớp, canvas '+res.W+'×'+res.H+' — chọn bộ phận cho từng lớp';
  const opts=[['','— bỏ qua —']].concat(parts.map(p=>[p.id,p.name+' ('+p.id+')']));
  for(let i=res.layers.length-1;i>=0;i--){
    const l=res.layers[i],d=document.createElement('div');d.className='mrow';
    const ck=document.createElement('input');ck.type='checkbox';ck.checked=l.on;ck.onchange=()=>l.on=ck.checked;
    const th=document.createElement('div');th.className='thumb';th.appendChild(thumbOf(l.canvas));
    const nm=document.createElement('div');nm.style.minWidth='0';
    nm.innerHTML='<div style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis"></div><small>'+l.w+'×'+l.h+(l.visible?'':' · ẩn')+'</small>';
    nm.firstChild.textContent=l.name;
    const se=document.createElement('select');
    opts.forEach(([v,lab])=>{const o=document.createElement('option');o.value=v;o.textContent=lab;se.appendChild(o);});
    se.value=l.part;
    se.onchange=()=>{l.part=se.value;l.on=!!se.value;ck.checked=l.on;};
    d.append(ck,th,nm,se);M.appendChild(d);
  }
}
async function openPSD(f){
  if(!f)return;
  $('#modal').hidden=false;$('#mList').innerHTML='';$('#mOk').disabled=true;
  try{
    $('#mTitle').textContent='Đang đọc '+f.name+' …';
    psdPending=await parsePSD(await f.arrayBuffer(),t=>$('#mTitle').textContent=t);
    autoMatchPsd();buildModal();$('#mOk').disabled=false;
  }catch(e){console.error(e);$('#modal').hidden=true;alert('Lỗi: '+(e.message||e));}
}
async function applyPSD(){
  const chosen={};
  psdPending.layers.forEach(l=>{if(l.on&&l.part)chosen[l.part]=l;});
  const ids=Object.keys(chosen);
  if(!ids.length){alert('Chưa gắn lớp nào vào bộ phận.');return;}
  const usePos=$('#mPos').checked;
  $('#mOk').disabled=true;
  let s=1,cx=0,bottom=0;
  if(usePos){
    let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
    ids.forEach(id=>{const l=chosen[id];x0=Math.min(x0,l.x);y0=Math.min(y0,l.y);x1=Math.max(x1,l.x+l.w);y1=Math.max(y1,l.y+l.h);});
    s=Math.min(1,700/(y1-y0),540/(x1-x0));cx=(x0+x1)/2;bottom=y1;
  }
  for(const id of ids){
    const p=byId[id],l=chosen[id];
    await setSrc(p,l.canvas.toDataURL('image/png'));
    if(usePos){p.h=Math.round(l.h*s*10)/10;p.sc=1;p.rot=0;p.flip=false;p.vis=true;}
  }
  if(usePos){
    const tgt={};
    ids.forEach(id=>{const p=byId[id],l=chosen[id];
      tgt[id]={x:(l.x+p.px*l.w-cx)*s+300,y:(l.y+p.py*l.h-bottom)*s+770};});
    const wp={};
    const wpos=p=>{
      if(wp[p.id])return wp[p.id];
      if(tgt[p.id])return wp[p.id]=tgt[p.id];
      const pw=p.parent==='root'?ROOT:wpos(byId[p.parent]);
      return wp[p.id]={x:pw.x+p.x,y:pw.y+p.y};
    };
    parts.forEach(wpos);
    ids.forEach(id=>{const p=byId[id],pw=p.parent==='root'?ROOT:wp[p.parent];
      p.x=Math.round(tgt[id].x-pw.x);p.y=Math.round(tgt[id].y-pw.y);});
  }
  $('#modal').hidden=true;$('#mOk').disabled=false;psdPending=null;
  select(sel);setTab('view');
}

// ---------- tab ----------
function setTab(t){$('main').dataset.tab=t;document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.tab));
$('#toView').onclick=()=>setTab('view');
// ---------- sự kiện ----------
$('#psdIn').onchange=e=>{openPSD(e.target.files[0]);e.target.value='';};
$('#mCancel').onclick=()=>{$('#modal').hidden=true;psdPending=null;};
$('#mOk').onclick=applyPSD;
$('#multi').onchange=async e=>{
  const ids=parts.map(p=>p.id).sort((a,b)=>b.length-a.length);
  for(const f of e.target.files){
    const n=norm(f.name);
    const id=ids.find(i=>norm(i)===n)||ids.find(i=>n.includes(norm(i)));
    if(id)await loadFile(byId[id],f);
  }
  e.target.value='';select(sel);
};
$('#bSave').onclick=saveProject;
$('#bLoad').onchange=e=>{if(e.target.files[0])openProject(e.target.files[0]);e.target.value='';};
$('#bPng').onclick=async()=>dl(await toBlob(previewCanvas()),($('#cname').value.trim()||'tuong')+'.png');
$('#bZip').onclick=exportZip;

anSelect(curAnim);buildList();buildProps();requestAnimationFrame(frame);
</script>
